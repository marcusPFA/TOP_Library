<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script src="javascript.js" defer></script>
    <div class="page-container">
        <table>
            <thead>
                <tr>
                    <th>TITLE</th>
                    <th>AUTHOR</th>
                    <th>PAGE COUNT</th>
                    <th>PROGRESS</th>
                    <th>BOOK ID</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button class="createBookButton">Add book to library</button>
        <dialog id="new-book-form">
            <div class="row-flex-container">
                <h2>New Book</h2>
                <button type="button" command="close" commandfor="new-book-form">Close</button>
            </div>
            <form>
                <div class="row-flex-container">
                    <label for="new-book-title">Book title:</label>
                    <input type="text" id="new-book-title" name="bookTitle" required>
                </div>
                <div class="row-flex-container">
                    <label for="new-book-author">Author:</label>
                    <input type="text" id="new-book-author" name="bookAuthor" required>
                </div>
                <div class="row-flex-container">
                    <label for="new-book-pages">Number of pages:</label>
                    <input type="number" id="new-book-pages" name="bookPages" required>
                </div>
                <div class="row-flex-container">
                    <label for="new-book-progress">Current page:</label>
                    <input type="number" id="new-book-progress" name="bookProgress">
                </div>
                <div class="row-flex-container">
                    <button type="submit">Add to shelf</button>
                    <button type="button">Remove book</button>
                </div>
            </form>
        </dialog>
    </div>
</body>
</html>
